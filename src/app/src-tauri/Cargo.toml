[package]
name = "memstick"
version = "0.1.0"
description = "A floating Markdown HUD workspace"
authors = ["soomin-kevin-sung"]
edition = "2021"

[lib]
name = "memstick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
