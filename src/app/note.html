<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memstick Note</title>
    <style>
      html,
      body,
      #note {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #fff770;
      }

      body[data-ready="true"] {
        background: transparent;
      }

      .note-fallback {
        height: 100%;
        display: grid;
        place-items: center;
        color: #18231f;
        font: 13px Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <div id="note"><main class="note-fallback">Loading note...</main></div>
    <script type="module" src="/src/note.ts"></script>
  </body>
</html>
