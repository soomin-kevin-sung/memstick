[package]
name = "memstick-service-poc"
version = "0.1.0"
description = "Memstick service-style desktop POC"
authors = ["soomin-kevin-sung"]
edition = "2021"

[lib]
name = "memstick_service_poc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
